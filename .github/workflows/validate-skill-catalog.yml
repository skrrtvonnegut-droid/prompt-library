name: Validate skill catalog

on:
  push:
    paths:
      - "catalog.yml"
      - "docs/skill-system.md"
      - "macros/**"
      - "schemas/**"
      - "scripts/**"
      - "skills/**"
      - "templates/**"
      - "work/**"
      - "writing/**"
      - "learning/**"
      - "meta/**"
      - ".github/workflows/validate-skill-catalog.yml"
  pull_request:
    paths:
      - "catalog.yml"
      - "docs/skill-system.md"
      - "macros/**"
      - "schemas/**"
      - "scripts/**"
      - "skills/**"
      - "templates/**"
      - "work/**"
      - "writing/**"
      - "learning/**"
      - "meta/**"
      - ".github/workflows/validate-skill-catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "pyyaml>=6,<7"

      - name: Validate catalog
        run: python scripts/validate_catalog.py
