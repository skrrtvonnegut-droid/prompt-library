# yaml-language-server: $schema=schemas/catalog.schema.json
schema_version: 2

repository:
  artifact_id: project.prompt-library
  canonical_home: github
  classification: Public
  purpose: Public, versioned registry of reusable AI prompts, macro aliases, and composable skills.
  canonical_content: markdown
  registry: catalog.yml
  agent_contract: AGENTS.md

invocation:
  activation: explicit
  patterns:
    - "Use macro: <alias>"
    - "Invoke <artifact-id>"
    - "Load skill: <alias-or-id>"
  resolution_order:
    - artifact_id
    - macro_alias
    - canonical_path
    - unique_name_or_tag
  ambiguity: surface_candidates
  missing_artifact: report_and_do_not_invent

classification_policy:
  allowed:
    - Public
    - Professional Portfolio
  forbidden:
    - Personal Private
    - Employer Confidential
    - Secrets
  private_material: Store only in an authorized private overlay; keep reusable public logic here.

artifacts:
