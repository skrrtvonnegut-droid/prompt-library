    kind: prompt
    name: Custom Macro Builder
    path: meta/custom-macro-builder.md
    domain: meta
    summary: Convert a rough request or recurring conversation pattern into a deduplicated, classified, registered, and versioned prompt-library macro.
    macros:
      - create-macro
      - macro-builder
    tags:
      - prompt-engineering
      - authoring
      - registry
      - classification
      - version-control
    status: active
    classification: Public

