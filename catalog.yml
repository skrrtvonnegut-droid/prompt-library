schema_version: 2
repository:
  artifact_id: project.prompt-library
  name: Prompt Library Skill Registry
  canonical_home: github
  classification: Public
  contract: docs/skill-system.md
  schema: schemas/catalog.schema.json
  public_registry: true
  overlay_contract:
    discovery: deployment-defined
    mode: catalog-extension
  invocation:
    skill_prefix: /skill
    prompt_prefix: /prompt
    macro_prefix: /
    natural_language_resolution: true
artifact_kinds:
  prompt: A reusable instruction set executed with user-provided inputs.
  skill: A routed capability with procedure, dependencies, guardrails, and an output contract.
  macro: A compact named command that expands into a prompt or skill invocation.
  template: A scaffold for authoring a new registry artifact.
